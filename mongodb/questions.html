<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MongoDB Questions</title>
<link rel="stylesheet" href="../assets/style.css">
</head>
<body>
<main>
  <nav class="crumbs" aria-label="Breadcrumb"><a href="../index.html">Home</a> / <a href="index.html">MongoDB</a> / Questions</nav>
  <div class="kicker">MongoDB Internals · Self-test</div>
  <div id="questions"><p>Loading <a href="QUESTIONS.md">QUESTIONS.md</a>…</p></div>
</main>
<!-- Renders QUESTIONS.md so the file stays the single source of truth. -->
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script>
  const el = document.getElementById('questions');

  // Wrap each "## Lesson" heading and what follows it in a collapsible section.
  function groupByLesson(root) {
    const sections = [];
    let current = null;
    for (const node of [...root.children]) {
      if (node.tagName === 'H2') {
        current = document.createElement('details');
        current.className = 'q-lesson';
        const summary = document.createElement('summary');
        summary.innerHTML = `<span class="q-lesson-title">${node.innerHTML}</span>`;
        current.append(summary);
        node.replaceWith(current);
        sections.push(current);
      } else if (current) {
        current.append(node);
      }
    }
    for (const s of sections) {
      const n = s.querySelectorAll('h3').length;
      s.querySelector('summary').insertAdjacentHTML('beforeend',
        `<span class="q-count">${n ? n + (n === 1 ? ' question' : ' questions') : 'none yet'}</span>`);
      if (n) s.open = true;
      else { s.classList.add('empty'); s.insertAdjacentHTML('beforeend', '<p class="q-empty">No questions logged for this lesson yet.</p>'); }
    }
    return sections;
  }

  function toolbar(sections) {
    const bar = document.createElement('div');
    bar.className = 'q-toolbar';
    const actions = [
      ['Expand all', () => sections.forEach(s => s.open = true)],
      ['Collapse all', () => el.querySelectorAll('details').forEach(d => d.open = false)],
      ['Show answers', () => { sections.forEach(s => s.open = true); el.querySelectorAll('.q-lesson details').forEach(d => d.open = true); }],
      ['Hide answers', () => el.querySelectorAll('.q-lesson details').forEach(d => d.open = false)],
    ];
    for (const [label, fn] of actions) {
      const b = document.createElement('button');
      b.type = 'button'; b.textContent = label; b.addEventListener('click', fn);
      bar.append(b);
    }
    return bar;
  }

  fetch('QUESTIONS.md')
    .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(md => {
      el.innerHTML = marked.parse(md);
      const intro = el.querySelector('h1 + p');
      if (intro) intro.classList.add('subtitle');
      const sections = groupByLesson(el);
      if (sections.length) sections[0].before(toolbar(sections));
    })
    .catch(() => {
      el.innerHTML = '<p>Couldn\'t load the questions. Open <a href="QUESTIONS.md">QUESTIONS.md</a> directly, or serve this folder over HTTP (fetch doesn\'t work from <code>file://</code>).</p>';
    });
</script>
</body>
</html>
