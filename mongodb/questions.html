<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MongoDB Questions</title>
<link rel="stylesheet" href="../assets/style.css">
</head>
<body>
<main>
  <nav class="crumbs" aria-label="Breadcrumb"><a href="../index.html">Home</a> / <a href="index.html">MongoDB</a> / Questions</nav>
  <div class="kicker">MongoDB Internals · Self-test</div>
  <h1>Questions I asked</h1>
  <p class="subtitle">Side questions from the lessons. Answer each one out loud, from memory, before you open it.</p>
  <div id="questions" aria-live="polite"><p class="q-loading">Loading questions…</p></div>
</main>
<!-- Renders QUESTIONS.md (the single source of truth) into question cards. -->
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script>
  const el = document.getElementById('questions');
  const CHEVRON = '<svg class="q-chev" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  // QUESTIONS.md → [{ heading, questions: [{ text, meta, answer }] }]
  function parse(md) {
    const doc = document.createElement('div');
    doc.innerHTML = marked.parse(md);
    const sections = [];
    let section = null, q = null;
    for (const node of doc.children) {
      if (node.tagName === 'H2') sections.push(section = { heading: node.textContent.trim(), questions: [] });
      else if (node.tagName === 'H3' && section) section.questions.push(q = { text: node.innerHTML.replace(/^Q:\s*/, ''), meta: '', answer: '' });
      else if (q && node.tagName === 'P' && !q.meta && !q.answer) q.meta = node.innerHTML;
      else if (q && node.tagName === 'DETAILS') { node.querySelector('summary')?.remove(); q.answer = node.innerHTML; }
    }
    return sections;
  }

  // "Lesson 0002 · Two lookups" → { num: "Lesson 0002", name: "Two lookups" }
  function splitHeading(h) {
    const i = h.indexOf(' · ');
    return i < 0 ? { num: '', name: h } : { num: h.slice(0, i), name: h.slice(i + 3) };
  }

  function lessonHref(section) {
    const a = document.createElement('div');
    for (const q of section.questions) {
      a.innerHTML = q.meta;
      const link = a.querySelector('a[href^="lessons/"]');
      if (link) return link.getAttribute('href').split('#')[0];
    }
    return null;
  }

  function render(sections) {
    const full = sections.filter(s => s.questions.length);
    const empty = sections.filter(s => !s.questions.length && splitHeading(s.heading).num);
    const total = full.reduce((n, s) => n + s.questions.length, 0);
    if (!total) {
      el.innerHTML = '<p class="q-empty">No questions yet. Ask one during a lesson and it will show up here.</p>';
      return;
    }

    let n = 0;
    el.innerHTML = `
      <div class="q-bar">
        <p class="q-stats"><strong>${total}</strong> ${total === 1 ? 'question' : 'questions'} · ${full.length} ${full.length === 1 ? 'lesson' : 'lessons'}</p>
        <button type="button" class="q-toggle" aria-pressed="false">Reveal all answers</button>
      </div>
      ${full.map(s => {
        const { num, name } = splitHeading(s.heading);
        const href = lessonHref(s);
        return `
        <details class="q-lesson" open>
          <summary>
            ${CHEVRON}
            <span class="q-lesson-head">
              ${num ? `<span class="q-lesson-num">${num}</span>` : ''}
              <span class="q-lesson-name">${name}</span>
            </span>
            <span class="q-count">${s.questions.length}</span>
          </summary>
          ${href ? `<a class="q-lesson-link" href="${href}">Open the lesson →</a>` : ''}
          <ol class="q-cards">
            ${s.questions.map(q => `
            <li class="q-card">
              <span class="q-num">${String(++n).padStart(2, '0')}</span>
              <div class="q-body">
                <h3 class="q-text">${q.text}</h3>
                ${q.meta ? `<p class="q-meta">${q.meta}</p>` : ''}
                <details class="q-answer">
                  <summary><span class="when-closed">Show answer</span><span class="when-open">Hide answer</span>${CHEVRON}</summary>
                  <div class="q-answer-body">${q.answer}</div>
                </details>
              </div>
            </li>`).join('')}
          </ol>
        </details>`;
      }).join('')}
      ${empty.length ? `<p class="q-none">No questions yet for: ${empty.map(s => splitHeading(s.heading).name).join(' · ')}</p>` : ''}`;

    const toggle = el.querySelector('.q-toggle');
    const answers = [...el.querySelectorAll('.q-answer')];
    const sync = () => {
      const all = answers.every(d => d.open);
      toggle.setAttribute('aria-pressed', String(all));
      toggle.textContent = all ? 'Hide all answers' : 'Reveal all answers';
    };
    toggle.addEventListener('click', () => {
      const open = toggle.getAttribute('aria-pressed') !== 'true';
      if (open) el.querySelectorAll('.q-lesson').forEach(d => d.open = true);
      answers.forEach(d => d.open = open);
      sync();
    });
    answers.forEach(d => d.addEventListener('toggle', sync));
  }

  // Opened from disk (file://), browsers block reading QUESTIONS.md, so fall back to the pushed copy on GitHub.
  const PUSHED = 'https://raw.githubusercontent.com/marcosmol204/foundaments/main/mongodb/QUESTIONS.md';
  const load = url => fetch(url, { cache: 'no-cache' }).then(r => { if (!r.ok) throw new Error(r.status); return r.text(); });
  const fromDisk = location.protocol === 'file:';

  (fromDisk ? load(PUSHED) : load('QUESTIONS.md').catch(() => load(PUSHED)))
    .then(md => {
      render(parse(md));
      if (fromDisk) el.insertAdjacentHTML('afterbegin', '<p class="q-loading">Opened from disk: showing the questions pushed to GitHub. Unpushed edits won\'t appear.</p>');
    })
    .catch(err => {
      console.error(err);
      el.innerHTML = '<p class="q-empty">Couldn\'t load the questions. Open <a href="QUESTIONS.md">QUESTIONS.md</a> directly, or view the site at <a href="https://marcosmol204.github.io/foundaments/mongodb/questions.html">marcosmol204.github.io</a>.</p>';
    });
</script>
</body>
</html>
